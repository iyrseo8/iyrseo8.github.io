<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hein Soe Oo</title>

<!-- Fonts and icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700;800&family=Questrial&family=Noto+Sans+Myanmar:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #458aab;
    color: #000;
    font-family: "Open Sans", Arial, sans-serif;
  }

  a { color: inherit; text-decoration: none; }

  .page {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 24px 24px;
  }

  /* ---------- Top bar ---------- */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
  }
  .site { font-weight: 700; font-size: 18px; }
  .social {
    display: flex;
    gap: 14px;
    margin-top: 6px;
    font-size: 26px;
    color: #fff;
  }
  .email {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }
  .email i { font-size: 22px; }

  /* ---------- Name ---------- */
  .name-block { margin-top: 24px; }
  .nickname { margin: 0; font-weight: 700; font-size: 13px; }
  h1 {
    margin: 0;
    font-family: "Questrial", sans-serif;
    font-weight: 400;
    font-size: 48px;
    line-height: 1.1;
  }
  .say { margin: 6px 0 0 4px; font-size: 13px; }
  .burmese {
    margin-left: 8px;
    font-family: "Noto Sans Myanmar", sans-serif;
    font-weight: 700;
    font-size: 18px;
  }

  /* ---------- Photo + text ---------- */
  .intro {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 70px;
    margin-top: 12px;
  }
  .intro img {
    display: block;
    width: 300px;
    height: 255px;
    object-fit: cover;
  }
  .intro p {
    margin: 0;
    color: #fff;
    font-weight: 700;
    font-size: 28px;
  }

  /* ---------- Line + subheading ---------- */
  hr {
    border: 0;
    border-top: 4px solid #fff;
    margin: 46px 0 20px;
  }
  h2 { margin: 0; font-weight: 800; font-size: 64px; }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 90px;
    text-align: center;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
  }

  /* ---------- Phones ---------- */
  @media (max-width: 640px) {
    .intro { grid-template-columns: 1fr; gap: 24px; }
    .intro img { width: 100%; height: auto; aspect-ratio: 300 / 255; }
    h1 { font-size: 40px; }
    h2 { font-size: 40px; }
  }
</style>
</head>

<body>
  <div class="page">

    <!-- Top bar -->
    <header class="top">
      <div>
        <div class="site">heinsoeoo.me</div>
        <div class="social">
          <!-- Replace each # with your profile link -->
          <a href="https://www.facebook.com/dev.hso/" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
          <a href="www.linkedin.com/in/hein-soe-oo-50a5021a9" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
          <a href="https://www.instagram.com/iyrseo8/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
      </div>
      <a class="email" href="mailto:heinsoeoo.154202@gmail.com">
        <i class="fa-regular fa-envelope"></i>
        heinsoeoo.154202@gmail.com
      </a>
    </header>

    <!-- Name -->
    <main>
      <div class="name-block">
        <p class="nickname">(Call me Hein)</p>
        <h1>Hein Soe Oo</h1>
        <p class="say">(Hayn- Soh- Oo)<span class="burmese" lang="my">ဟိန်းစိုးဦး< span class="korean" lang="myk"> 해인소우 </span></p>
      </div>

      <!-- Photo + text -->
      <div class="intro">
        <!-- Upload your photo to the repository and name it photo.jpg -->
        <img src="photo.jpg" alt="Photo of Hein Soe Oo">
        <p>Text</p>
      </div>

      <hr>

      <h2>Add a subheading</h2>
    </main>

    <!-- Footer -->
    <footer>© HEIN SOE OO</footer>

  </div>
</body>
</html>
