<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography — Hein Soe Oo</title>
<link rel="icon" type="image/png" href="favicon.jpg">
<link rel="apple-touch-icon" href="favicon.jpg">
<!-- This page has no shoot content of its own. It reads the shoot named in the
     address (for example shoot.html#shoot3) from index.html and shows it here,
     so you only ever write a shoot once, in index.html. -->

<!-- Fonts and icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
  :root {
    --bg: #9a6b6b;            /* same as the Side quests page */
    --text: #fff;
    --box: rgba(255, 255, 255, 0.12);
    --box-line: rgba(255, 255, 255, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Open Sans", Arial, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }

  .page {
    max-width: 1240px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 32px 32px 18px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar (same as the main page) ---------- */
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 16px;
  }
  .site { font-weight: 700; font-size: 18px; }
  .nav { display: flex; gap: 24px; }
  .nav a {
    font-weight: 700;
    font-size: 16px;
    text-decoration: underline 2px transparent;
    text-underline-offset: 6px;
    transition: text-decoration-color 0.2s;
  }
  .nav a:hover,
  .nav a[aria-current="page"] { text-decoration-color: var(--text); }

  /* ---------- Shoot ---------- */
  main { margin-top: 36px; }
  .back {
    display: inline-block;
    margin-bottom: 18px;
    font-weight: 700;
    font-size: 14px;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  h1 {
    margin: 0;
    font-family: Impact, "Anton", "Arial Narrow", sans-serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 20px;
    margin-top: 10px;
    font-size: 14px;
  }
  .meta i { margin-right: 6px; }
  .when { opacity: 0.85; }
  .story {
    max-width: 65ch;
    margin: 18px 0 0;
    font-size: 15px;
    line-height: 1.7;
  }

  /* All photos: preview + extra */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    margin-top: 26px;
  }
  .gallery img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.15);   /* shows until a photo is added */
  }

  .notice {
    max-width: 50ch;
    padding: 18px 20px;
    background: var(--box);
    border: 1px solid var(--box-line);
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.6;
  }

  footer {
    margin-top: auto;
    padding-top: 40px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
  }

  @media (max-width: 640px) {
    .page { padding: 24px 20px 16px; }
    .nav { gap: 16px; }
    h1 { font-size: 42px; }
    .gallery { grid-template-columns: 1fr 1fr; gap: 6px; }
  }
</style>
</head>

<body>
  <div class="page">

    <header class="row">
      <a class="site" href="index.html">heinsoeoo.me</a>
      <nav class="nav" aria-label="Pages">
        <a href="index.html#me">Me</a>
        <a href="index.html#publications">Publications</a>
        <a href="index.html#side-quests" aria-current="page">Side quests</a>
      </nav>
    </header>

    <main id="shoot">
      <a class="back" href="index.html#side-quests">Back to Side quests</a>
      <p class="notice">Loading…</p>
    </main>

    <footer>© HEIN SOE OO</footer>
  </div>

<script>
  const main = document.getElementById('shoot');
  const id = decodeURIComponent(location.hash.slice(1));
  const blank = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  function showNotice(text) {
    main.querySelector('.notice').textContent = text;
  }

  fetch('index.html')
    .then(response => response.text())
    .then(html => {
      const page = new DOMParser().parseFromString(html, 'text/html');
      const shoot = id && page.getElementById(id);
      if (!shoot || !shoot.classList.contains('shoot')) {
        showNotice("This shoot couldn't be found. Go back to Side quests and open it from there.");
        return;
      }

      const title = shoot.querySelector('h3')?.textContent.trim() || 'Photography';
      const where = shoot.querySelector('.where')?.textContent.trim() || '';
      const when = shoot.querySelector('.when')?.textContent.trim() || '';
      const story = shoot.querySelector('.story')?.innerHTML || '';
      const photos = [...shoot.querySelectorAll('.shots img')].map(img => img.getAttribute('src'));

      document.title = title + ' — Hein Soe Oo';

      main.innerHTML = `
        <a class="back" href="index.html#side-quests">Back to Side quests</a>
        <h1></h1>
        <div class="meta">
          <span class="where"><i class="fa-solid fa-location-dot"></i><span></span></span>
          <span class="when"></span>
        </div>
        ${story ? '<p class="story"></p>' : ''}
        <div class="gallery"></div>`;
      main.querySelector('h1').textContent = title;
      main.querySelector('.where span').textContent = where;
      main.querySelector('.when').textContent = when;
      if (story) main.querySelector('.story').innerHTML = story;

      const gallery = main.querySelector('.gallery');
      photos.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = title + ' photo';
        img.loading = 'lazy';
        img.addEventListener('error', () => { if (img.src !== blank) img.src = blank; });
        gallery.appendChild(img);
      });
    })
    .catch(() => {
      // Happens when the file is opened from your computer instead of the website
      showNotice('Open this page on heinsoeoo.me to see the shoot. It can\'t load when opened as a file from your computer.');
    });
</script>
</body>
</html>
